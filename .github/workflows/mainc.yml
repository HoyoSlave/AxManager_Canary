name: Compile Preload for Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v3
      with:
        ndk-version: r26c
        add-to-path: true

    - name: Cross-Compile for Android (ARM64)
      run: |
        # Menggunakan toolchain clang dari NDK untuk API level 28 (Android 9+) ke atas
        $CC -target aarch64-linux-android28 -Os -s preload.c -o preload
        llvm-strip preload

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: preload-android-arm64
        path: preload
