name: Native Compile on ARM64 Runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  native-build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Clang & C++ Standard Library
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: Compile and Run
        run: |
          # Menggunakan clang++ dan mengabaikan warning duplikasi _GNU_SOURCE jika ada
          clang++ -O3 -Wno-macro-redefined main.cpp -o main
          ./main
