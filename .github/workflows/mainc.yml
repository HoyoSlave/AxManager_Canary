name: Build Preload

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    # 64비트 Ubuntu 최신 환경 지정 (x86_64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up GCC (Ensure 64-bit)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib

    - name: Compile with GCC (-Oz, -s, 64-bit)
      run: |
        # [케이스 A] 만약 LD_PRELOAD를 위한 공유 라이브러리(.so) 형태인 경우:
        # gcc -m64 -shared -fPIC -Oz -s preload.c -o preload.so
        
        # [케이스 B] 일반 실행 파일 형태인 경우:
        gcc -m64 -Oz -s preload.c -o preload

    - name: Grant Execution Permission
      run: |
        # 바이너리 실행 권한 부여
        chmod +x preload || true

    - name: Verify Binary
      run: |
        # 파일 정보 확인 (64-bit ELF 확인용)
        file preload
        ls -lh preload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: preload-binary-64bit
        path: preload
